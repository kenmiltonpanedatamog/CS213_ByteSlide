<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CS213 Slide Puzzle</title>
        <link rel="stylesheet" href="puzzle.css">
        <script src="puzzle.js" defer></script>
    </head>

    <body>
        <main id="container"> 
            <h1 id="title">CS213 Slide Puzzle</h1>
            
            <!-- Side-by-side boards row -->
            <div id="boards-wrapper">
                <div id="reference"><span id="reference_image"></span></div>
                <div id="board"></div>
            </div>

            <!-- Stats & Info section below boards -->
            <div id="info-section">
                <div id="stats-row">
                    <h2 id="level-title">Level <span id="level">1</span></h2>
                    <h2 id="turns-title">Turns: <span id="turns">0</span></h2>
                </div>

                <div id="info">
                    <p class="info-text"></p>
                </div>

                <div id="button-group">
                    <button id="reset-btn">Reset Puzzle</button>
                    <!-- "Next Level" button dynamically inserts here -->
                </div>
            </div>
        </main>
    </body>
</html>
